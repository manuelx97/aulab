[project]
name = "selfwork-openai-assistant-travel"
version = "0.1.0"
description = "Chainlit app that replicates an OpenAI Assistant project with file search and a custom function."
authors = [
    {name = "Emanuel Marinelli", email = "emanuelmarinelli@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "chainlit>=2.0.0,<3.0.0",
    "openai>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["travel_assistant*"]
